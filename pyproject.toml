[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".git", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
# Preserve Ruff's default correctness rules and apply them consistently to the
# entire repository, including the scanner and all tests.
select = ["E4", "E7", "E9", "F"]
