[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".git", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
# Apply correctness checks across the repository. Legacy compact one-line
# statements and multi-import lines are grandfathered for incremental cleanup.
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E701", "E702"]
