name: MM2 Scanner Scheduler

on:
  # Ten-minute cadence; watchdog recovery covers missed scheduled dispatches.
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan.yml"
      - ".github/workflows/scan-scheduler.yml"
      - "scanner.py"
      - "discord_parser.py"
      - "rblxvalue_guard.py"
      - "market_history.py"
      - "tools/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview a manual scan without Telegram alerts; set false only for an intentional live run"
        required: false
        type: boolean
        default: true
      verify_rblxvalue_key:
        description: "Send one small request to verify the configured RBLXValue API key"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  scan:
    name: Run the reusable MM2 scanner
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/scan.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      verify_rblxvalue_key: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_rblxvalue_key || false }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RBLXVALUE_API_KEY: ${{ secrets.RBLXVALUE_API_KEY }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
