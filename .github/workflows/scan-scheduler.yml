name: MM2 Scanner Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["MM2 Scanner Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/scan.yml
    secrets: inherit
