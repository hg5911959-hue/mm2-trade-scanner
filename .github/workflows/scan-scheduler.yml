name: MM2 Scanner Scheduler
run-name: MM2 Scanner Scheduler · ${{ inputs.auto_chain && 'chain' || (inputs.dry_run && 'dry-run' || 'live') }}

on:
  # Ten-minute cadence; watchdog recovery covers missed scheduled dispatches.
  schedule:
    - cron: "3-59/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan.yml"
      - ".github/workflows/scan-scheduler.yml"
      - "scanner.py"
      - "discord_parser.py"
      - "rblxvalue_guard.py"
      - "market_history.py"
      - "tools/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview a manual scan without Telegram alerts; set false only for an intentional live run"
        required: false
        type: boolean
        default: true
      auto_chain:
        description: "Internal: continue the automated scan loop after this run"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  scan:
    name: Run the reusable MM2 scanner
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/scan.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
