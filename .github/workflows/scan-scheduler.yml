name: MM2 Scanner Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["MM2 Scanner Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  enable-schedules:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-enable scheduled workflows if GitHub disabled them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow_file in scan-scheduler.yml watchdog-scheduler.yml; do
            workflow_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows" \
              --jq ".workflows[] | select(.path == \".github/workflows/$workflow_file\") | .id" 2>/dev/null || true)"
            if [ -z "$workflow_id" ]; then
              echo "::warning::Could not resolve workflow id for $workflow_file."
              continue
            fi
            state="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" --jq '.state' 2>/dev/null || echo unknown)"
            case "$state" in
              disabled_inactivity)
                if gh api --method PUT "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/enable" >/dev/null 2>&1; then
                  echo "[schedule] re-enabled inactive $workflow_file"
                else
                  echo "::warning::GitHub refused to re-enable $workflow_file; administrator permission may be required."
                fi
                ;;
              disabled_manually)
                echo "[schedule] respecting manual disable for $workflow_file"
                ;;
              active)
                echo "[schedule] $workflow_file is active"
                ;;
              *)
                echo "::warning::Could not confirm workflow state for $workflow_file."
                ;;
            esac
          done

  scan:
    needs: enable-schedules
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/scan.yml
    secrets: inherit
