name: Repository keepalive

on:
  schedule:
    - cron: "17 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Update monthly activity marker
        run: |
          printf 'Repository keepalive: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/KEEPALIVE.md
      - name: Commit activity marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/KEEPALIVE.md
          git diff --cached --quiet || git commit -m "chore: monthly scheduled-workflow keepalive"
          git push
