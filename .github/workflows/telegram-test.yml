name: Telegram Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send a safe Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from tools.telegram_transport import TELEGRAM_OPENER

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret.")

          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": (
                  "💎 MM2 TRADE <b>ALERT — TEST ONLY</b>\n"
                  "🟢 <b>TELEGRAM HTML DELIVERY CHECK</b>\n\n"
                  "📤 <b>YOU GIVE</b> <i>(cash replacement cost)</i>\n"
                  "• <b>Test Item A</b> <code>×1</code>\n"
                  "  $1.00 each → <b>$1.00</b>\n"
                  "Total cost: <b>$1.00</b>\n\n"
                  "📥 <b>YOU GET</b> <i>(net cash resale)</i>\n"
                  "• <b>Test Item B</b> <code>×1</code>\n"
                  "  $1.25 each → <b>$1.25</b>\n"
                  "Net resale: <b>$1.25</b>\n\n"
                  "💵 <b>CASH PROFIT (CONSERVATIVE): +$0.25</b>\n"
                  "📊 CASH ROI: <b>25.00%</b>\n"
                  "🏁 <b>RESULT: CASH WIN</b>\n\n"
                  "Cash price source: robase.gg (seller proceeds after fees)\n"
                  "🧪 TEST ONLY — this is not a live offer.\n"
                  "UTC: " + datetime.now(timezone.utc).isoformat(timespec="seconds")
              ),
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with TELEGRAM_OPENER.open(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              try:
                  result = json.loads(exc.read(1000).decode("utf-8"))
                  detail = result.get("description", "Telegram rejected the request")
                  code = result.get("error_code", exc.code)
              except Exception:
                  detail, code = "Telegram returned an unreadable error", exc.code
              raise SystemExit(f"Telegram test failed (HTTP/API {code}): {detail}")
          except Exception as exc:
              raise SystemExit(f"Telegram test failed due to network error: {type(exc).__name__}")

          if not result.get("ok"):
              raise SystemExit(
                  f"Telegram test failed (API {result.get('error_code', 'unknown')}): "
                  f"{result.get('description', 'unknown error')}"
              )
          print("Telegram test message delivered successfully.")
          print("Telegram message_id:", result.get("result", {}).get("message_id", "unknown"))
          PY
