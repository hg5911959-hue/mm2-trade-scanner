name: ROBASE Pricing Tests

on:
  pull_request:
    paths:
      - "tools/robase_prices.py"
      - "tools/cash_market.py"
      - "tests/test_robase_prices.py"
      - "tests/test_cash_market.py"
      - "scanner.py"
      - ".github/workflows/robase-pricing-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/robase_prices.py"
      - "tools/cash_market.py"
      - "tests/test_robase_prices.py"
      - "tests/test_cash_market.py"
      - "scanner.py"
      - ".github/workflows/robase-pricing-tests.yml"

permissions:
  contents: read

jobs:
  robase-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MM2_TESTING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run ROBASE parser tests
        run: python -m unittest discover -s tests -p "test_robase_prices.py"
      - name: Run cash valuation tests
        run: python -m unittest discover -s tests -p "test_cash_market.py"
      - name: Validate live ROBASE snapshot
        run: |
          python -m tools.robase_prices --output "$RUNNER_TEMP/robase_prices.json"
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.cash_market import load_robase_price_catalog
          catalog = load_robase_price_catalog(Path(os.environ["RUNNER_TEMP"]) / "robase_prices.json")
          print(
              "[robase-live] rows=%d verified=%d unverified=%d"
              % (
                  catalog["row_count"],
                  catalog["verified_count"],
                  catalog["row_count"] - catalog["verified_count"],
              )
          )
          if catalog["verified_count"] < 8:
              raise SystemExit("ROBASE has fewer than 8 sufficiently traded items; live cash mode must remain disabled.")
          PY
      - name: Probe ROBASE pagination over HTTP/2
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import subprocess

          for page in (1, 2):
              url = "https://robase.gg/api/list?r=&page=%s&v=1" % page
              command = [
                  "curl", "--http2", "--silent", "--show-error",
                  "--user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
                  "--header", "Accept: */*",
                  "--header", "Referer: https://robase.gg/",
                  "--write-out", "\\nHTTP_STATUS:%{http_code}",
                  url,
              ]
              result = subprocess.run(command, capture_output=True, text=True, timeout=30)
              body, _, status_text = result.stdout.rpartition("\\nHTTP_STATUS:")
              status = status_text.strip() or "curl-error"
              try:
                  data = json.loads(body)
                  rows = data.get("data", []) if isinstance(data, dict) else []
                  print("[robase-api-h2] page=%s status=%s rows=%s" % (page, status, len(rows)))
              except ValueError:
                  print("[robase-api-h2] page=%s status=%s" % (page, status))
          PY
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.5
      - name: Lint ROBASE pricing changes
        run: ruff check --select F scanner.py tools/robase_prices.py tools/cash_market.py tests/test_robase_prices.py tests/test_cash_market.py
