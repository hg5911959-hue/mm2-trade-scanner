name: ROBASE Pricing Tests

on:
  pull_request:
    paths:
      - "tools/robase_prices.py"
      - "tools/robase_price_history.py"
      - "tools/cash_market.py"
      - "tools/robase_daily_chart_prices.py"
      - "tests/test_robase_daily_chart_prices.py"
      - "tests/test_robase_prices.py"
      - "tests/test_robase_price_history.py"
      - "tests/test_cash_market.py"
      - "scanner.py"
      - ".github/workflows/robase-pricing-tests.yml"
      - ".github/workflows/robase-daily-history.yml"
      - ".github/workflows/robase-daily-chart-shadow.yml"
      - ".github/workflows/scan.yml"
      - ".github/workflows/scan-core.yml"
      - "tests/test_robase_daily_history_workflow.py"
      - "tests/test_robase_daily_chart_shadow_workflow.py"
  push:
    branches: [main]
    paths:
      - "tools/robase_prices.py"
      - "tools/robase_price_history.py"
      - "tools/cash_market.py"
      - "tools/robase_daily_chart_prices.py"
      - "tests/test_robase_daily_chart_prices.py"
      - "tests/test_robase_prices.py"
      - "tests/test_robase_price_history.py"
      - "tests/test_cash_market.py"
      - "scanner.py"
      - ".github/workflows/robase-pricing-tests.yml"
      - ".github/workflows/robase-daily-history.yml"
      - "tests/test_robase_daily_history_workflow.py"

permissions:
  contents: read

jobs:
  robase-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MM2_TESTING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run ROBASE parser tests
        run: python -m unittest discover -s tests -p "test_robase_prices.py"
      - name: Run daily ROBASE history archive tests
        run: python -m unittest discover -s tests -p "test_robase_price_history.py"
      - name: Run daily chart selector and archive integrity tests
        run: python -m unittest discover -s tests -p "test_robase_daily_chart_prices.py"
      - name: Run daily archive workflow guard tests
        run: python -m unittest discover -s tests -p "test_robase_daily_history_workflow.py"
      - name: Run daily chart shadow workflow guard tests
        run: python -m unittest discover -s tests -p "test_robase_daily_chart_shadow_workflow.py"
      - name: Run cash valuation tests
        run: python -m unittest discover -s tests -p "test_cash_market.py"
      - name: Validate live ROBASE snapshot
        run: |
          python -m tools.robase_prices --output "$RUNNER_TEMP/robase_prices.json"
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.cash_market import load_robase_price_catalog
          catalog = load_robase_price_catalog(Path(os.environ["RUNNER_TEMP"]) / "robase_prices.json")
          print(
              "[robase-live] rows=%d verified=%d cash_eligible=%d"
              % (
                  catalog["row_count"],
                  catalog["verified_count"],
                  catalog["cash_eligible_count"],
              )
          )
          if catalog["cash_eligible_count"] < 8:
              raise SystemExit("ROBASE has fewer than 8 fresh items with at least 3 Chroma Sold (7d); live cash mode must remain disabled.")
          PY
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.5
      - name: Lint ROBASE pricing changes
        run: ruff check --select F scanner.py tools/robase_prices.py tools/robase_price_history.py tools/robase_daily_chart_prices.py tools/cash_market.py tests/test_robase_prices.py tests/test_robase_price_history.py tests/test_robase_daily_chart_prices.py tests/test_robase_daily_history_workflow.py tests/test_robase_daily_chart_shadow_workflow.py tests/test_cash_market.py
