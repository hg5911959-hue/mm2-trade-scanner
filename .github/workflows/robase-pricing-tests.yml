name: ROBASE Pricing Tests

on:
  pull_request:
    paths:
      - "tools/robase_prices.py"
      - "tools/cash_market.py"
      - "tests/test_robase_prices.py"
      - "tests/test_cash_market.py"
      - "scanner.py"
      - ".github/workflows/robase-pricing-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/robase_prices.py"
      - "tools/cash_market.py"
      - "tests/test_robase_prices.py"
      - "tests/test_cash_market.py"
      - "scanner.py"
      - ".github/workflows/robase-pricing-tests.yml"

permissions:
  contents: read

jobs:
  robase-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MM2_TESTING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run ROBASE parser tests
        run: python -m unittest discover -s tests -p "test_robase_prices.py"
      - name: Run cash valuation tests
        run: python -m unittest discover -s tests -p "test_cash_market.py"
      - name: Validate live ROBASE snapshot
        run: |
          python -m tools.robase_prices --output "$RUNNER_TEMP/robase_prices.json"
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.cash_market import load_robase_price_catalog
          catalog = load_robase_price_catalog(Path(os.environ["RUNNER_TEMP"]) / "robase_prices.json")
          print(
              "[robase-live] rows=%d verified=%d unverified=%d"
              % (
                  catalog["row_count"],
                  catalog["verified_count"],
                  catalog["row_count"] - catalog["verified_count"],
              )
          )
          if catalog["verified_count"] < 8:
              raise SystemExit("ROBASE has fewer than 8 sufficiently traded items; live cash mode must remain disabled.")
          PY
      - name: Probe public ROBASE pagination endpoint
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import time
          from http.cookiejar import CookieJar
          from urllib.error import HTTPError
          from urllib.request import HTTPCookieProcessor, Request, build_opener

          opener = build_opener(HTTPCookieProcessor(CookieJar()))
          user_agent = "MM2-Trade-Scanner/1.0 (public price snapshot)"
          with opener.open(Request("https://robase.gg/", headers={
              "User-Agent": user_agent, "Accept": "text/html",
          }), timeout=25) as response:
              print("[robase-api] home_status=%s" % response.status)
          for page in (1, 2):
              url = "https://robase.gg/api/list?r=&page=%s&v=1&_=%s" % (
                  page, int(time.time() * 1000),
              )
              for method in ("GET", "POST"):
                  request = Request(url, data=None if method == "GET" else b"",
                                    method=method, headers={
                      "User-Agent": user_agent,
                      "Accept": "application/json, text/javascript, */*; q=0.01",
                      "Referer": "https://robase.gg/",
                      "Origin": "https://robase.gg",
                      "X-Requested-With": "XMLHttpRequest",
                      "Sec-Fetch-Site": "same-origin",
                      "Sec-Fetch-Mode": "cors",
                      "Sec-Fetch-Dest": "empty",
                      "Content-Type": "application/x-www-form-urlencoded",
                  })
                  try:
                      with opener.open(request, timeout=25) as response:
                          body = response.read(2_000_001)
                          if len(body) > 2_000_000:
                              print("[robase-api] page=%s method=%s response_over_2mb" % (page, method))
                              continue
                          data = json.loads(body.decode("utf-8"))
                          if isinstance(data, list):
                              count, keys = len(data), "list"
                          elif isinstance(data, dict):
                              keys = ",".join(sorted(data.keys()))
                              count = next((len(v) for v in data.values() if isinstance(v, list)), 0)
                          else:
                              count, keys = 0, type(data).__name__
                          print("[robase-api] page=%s method=%s status=%s type=%s records=%s keys=%s"
                                % (page, method, response.status,
                                   response.headers.get("Content-Type", ""), count, keys))
                  except HTTPError as exc:
                      print("[robase-api] page=%s method=%s status=%s" % (page, method, exc.code))
          PY
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.5
      - name: Lint ROBASE pricing changes
        run: ruff check --select F scanner.py tools/robase_prices.py tools/cash_market.py tests/test_robase_prices.py tests/test_cash_market.py
