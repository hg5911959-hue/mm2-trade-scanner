name: MM2 Scanner Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    env:
      MM2_TESTING: "true"
      CASH_MAX_AGE_DAYS: "14"
      MM2_STATE_REPO: ${{ secrets.MM2_STATE_REPO_TOKEN != '' && 'hg5911959-hue/mm2-trade-scanner-state' || '' }}
      MM2_STATE_REPO_TOKEN: ${{ secrets.MM2_STATE_REPO_TOKEN }}
      MM2_STATE_ALLOW_MIGRATION: "false"
    # Regression tests are required before the production scanner can be re-enabled.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the full isolated suite twice and verify data remains untouched
        shell: bash
        run: |
          set -euo pipefail
          data_hash() {
            if [ -d data ]; then
              find data -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1
            else
              printf 'missing-data-directory'
            fi
          }
          for pass in 1 2; do
            echo "Regression suite pass $pass/2"
            before_hash="$(data_hash)"
            python -m unittest discover -s tests
            after_hash="$(data_hash)"
            if [ "$before_hash" != "$after_hash" ]; then
              echo "::error::Test suite changed one or more files under data/"
              exit 1
            fi
            if [ -n "$(git status --porcelain data)" ]; then
              echo "::error::Tests changed tracked or untracked data/ files"
              git status --short data
              exit 1
            fi
          done

      - name: Configure private durable state repository
        run: bash tools/configure_state_remote.sh

      - name: Validate current durable dedupe checkpoints
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            echo "No durable state branch exists yet; skipping the live-state compatibility check."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin refs/heads/state
          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          git archive FETCH_HEAD \
            data/alerted.json \
            data/telegram_uncertain.json \
            data/telegram_uncertain_context.json \
            data/seen_ads.json \
            data/pending_recheck.json \
            data/pending_recheck_schedule.json \
            data/first_seen_ads.json \
            data/watch_ads.json \
            data/maintenance_alerts.json | tar -x -C "$state_dir"
          python tools/validate_state.py --directory "$state_dir/data" --dedupe-only

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.5

      - name: Run Ruff on parser, API guard, history and dashboard modules
        run: ruff check tools/preflight.py tools/weekly_report.py tools/next_to_verify.py discord_parser.py rblxvalue_guard.py market_history.py market_intelligence/ai_advisor.py market_intelligence/public_sources.py tools/export_dashboard.py tools/cash_market.py tools/validate_state.py tests/test_cash_market.py tests/test_state_validation.py tests/test_discord_parser.py tests/test_rblxvalue_guard.py tests/test_rblxvalue_cache_migration.py tests/test_market_history.py tests/test_market_intelligence.py

      - name: Run focused correctness lint on scanner
        run: ruff check --select F scanner.py

      - name: Run undefined and unused-name checks across the repository
        run: ruff check --select F .

