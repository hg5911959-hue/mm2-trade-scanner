name: MM2 Scanner Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Regression tests are required before the production scanner can be re-enabled.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run parser and reliability regression tests
        run: python -m unittest discover -s tests -v

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff

      - name: Run Ruff on parser, API guard, history and dashboard modules
        run: ruff check rblxvalue_guard.py market_history.py tools/export_dashboard.py tests/test_rblxvalue_guard.py tests/test_rblxvalue_cache_migration.py tests/test_market_history.py
