name: MM2 Scanner Tests

on:
  push:
    branches: [main, hardening/staged-audit-2026-11-12, 'fix/quantity-provenance-2026-11-12', 'fix/full-hardening-2026-11-12', 'hardening/mm2-no-missed-offers']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Regression tests are required before the production scanner can be re-enabled.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run parser and reliability regression tests
        run: python -m unittest discover -s tests -v
