name: MM2 Scanner Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Regression tests are required before the production scanner can be re-enabled.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the full isolated suite twice and verify data remains untouched
        shell: bash
        run: |
          set -euo pipefail
          data_hash() {
            if [ -d data ]; then
              find data -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1
            else
              printf 'missing-data-directory'
            fi
          }
          for pass in 1 2; do
            echo "Regression suite pass $pass/2"
            before_hash="$(data_hash)"
            python -m unittest discover -s tests
            after_hash="$(data_hash)"
            if [ "$before_hash" != "$after_hash" ]; then
              echo "::error::Test suite changed one or more files under data/"
              exit 1
            fi
            if [ -n "$(git status --porcelain data)" ]; then
              echo "::error::Tests changed tracked or untracked data/ files"
              git status --short data
              exit 1
            fi
          done

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.5

      - name: Run Ruff on all market, privacy, API and scanner modules
        run: ruff check scanner.py discord_parser.py cash_offer_parser.py market_book.py telegram_market.py private_state.py rblxvalue_guard.py market_history.py market_intelligence/ai_advisor.py market_intelligence/public_sources.py tools/export_dashboard.py tools/cash_market.py tools/validate_state.py tests/test_cash_offer_parser.py tests/test_market_book.py tests/test_telegram_market.py tests/test_private_state.py tests/test_workflow_config.py tests/test_cash_market.py tests/test_state_validation.py tests/test_discord_parser.py tests/test_rblxvalue_guard.py tests/test_rblxvalue_cache_migration.py tests/test_market_history.py tests/test_market_intelligence.py

      - name: Run focused correctness lint on scanner
        run: ruff check --select F scanner.py
 
      - name: Run undefined and unused-name checks across the repository
        run: ruff check --select F .
