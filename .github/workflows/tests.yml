name: MM2 Scanner Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Regression tests are required before the production scanner can be re-enabled.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run parser and reliability regression tests
        run: python -m unittest discover -s tests -v

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.5

      - name: Run Ruff on parser, API guard, history and dashboard modules
        run: ruff check discord_parser.py rblxvalue_guard.py market_history.py market_intelligence/ai_advisor.py market_intelligence/public_sources.py tools/export_dashboard.py tools/cash_market.py tools/validate_state.py tests/test_cash_market.py tests/test_state_validation.py tests/test_discord_parser.py tests/test_rblxvalue_guard.py tests/test_rblxvalue_cache_migration.py tests/test_market_history.py tests/test_market_intelligence.py

      - name: Run focused correctness lint on scanner
        run: ruff check --select F scanner.py
 
      - name: Run undefined and unused-name checks across the repository
        run: ruff check --select F .
