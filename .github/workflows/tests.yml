name: MM2 Scanner Tests

on:
  push:
    branches: [main, hardening/staged-audit-2026-11-12, 'fix/quantity-provenance-2026-11-12']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser and reliability regression tests
        run: python -m unittest discover -s tests -v
