name: RBLXValue Supreme Value-profit Shadow Analysis

on:
  # Manual-only research. Automatic archive-triggered scans add BloxSwaps API load
  # and must not compete with the production cash scanner.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  shadow:
    if: github.event_name == 'workflow_dispatch'
    name: Manual Supreme value-profit shadow analysis (no alerts or RBLXValue API)
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/scan-core.yml
    with:
      dry_run: true
      rblxvalue_value_profit_shadow: true
