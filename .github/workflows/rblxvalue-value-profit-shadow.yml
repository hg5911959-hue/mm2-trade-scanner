name: RBLXValue Supreme Value-profit Shadow Analysis

on:
  workflow_run:
    workflows: ["RBLXValue Daily Weapon History"]
    types: [completed]
  # This offline analysis requires a completed snapshot for the current day.
  # Run after the daily archive, or manually; code pushes must not trigger stale-snapshot failures.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  shadow:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Analyze Supreme value-profit without alerts or API access
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/scan-core.yml
    with:
      dry_run: true
      rblxvalue_value_profit_shadow: true
