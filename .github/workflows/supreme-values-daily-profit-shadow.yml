name: Supreme Values Daily Profit Shadow

on:
  workflow_run:
    workflows: ["RBLXValue Daily Weapon History"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: supreme-values-daily-profit-shadow
  cancel-in-progress: false

jobs:
  supreme-value-profit-shadow:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/scan-core.yml
    with:
      rblxvalue_value_profit_shadow: true
