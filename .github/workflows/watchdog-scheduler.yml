name: MM2 Watchdog Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["MM2 Scanner Scheduler"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  restore-scanner-schedule:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-enable scanner schedule after GitHub inactivity disablement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.path == ".github/workflows/scan-scheduler.yml") | .id' 2>/dev/null || true)"
          if [ -z "$workflow_id" ]; then
            echo "::warning::Could not resolve scan-scheduler workflow id."
            exit 0
          fi
          state="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" --jq '.state' 2>/dev/null || echo unknown)"
          case "$state" in
            disabled_inactivity)
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/enable" >/dev/null 2>&1; then
                echo "[schedule] re-enabled scan-scheduler after inactivity disablement"
              else
                echo "::warning::GitHub refused to re-enable scan-scheduler; administrator permission may be required."
              fi
              ;;
            disabled_manually)
              echo "[schedule] respecting manual disable for scan-scheduler"
              ;;
            active)
              echo "[schedule] scan-scheduler is active"
              ;;
            *)
              echo "::warning::Could not confirm scan-scheduler state."
              ;;
          esac

  watchdog:
    needs: restore-scanner-schedule
    uses: ./.github/workflows/watchdog.yml
    secrets: inherit
