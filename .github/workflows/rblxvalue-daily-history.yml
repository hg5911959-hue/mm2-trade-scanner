name: RBLXValue Daily Weapon History

on:
  schedule:
    # RBLXValue refreshes about every 12h around 00:00/12:00 Amsterdam.
    # Collect 30m later in winter (CET): 11:30/23:30 UTC = 12:30/00:30 Algeria.
    # UTC scheduling is fixed; during CEST the capture is about 90m after refresh.
    - cron: "30 11,23 * * *"
  workflow_dispatch:
  # Run once when this workflow is repaired/updated on main; future routine code changes do not retrigger collection.
  push:
    branches: [main]
    paths:
      - ".github/workflows/rblxvalue-daily-history.yml"
      - "tools/rblxvalue_daily.py"

concurrency:
  group: rblxvalue-daily-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    name: Collect RBLXValue data (secret-isolated)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Restore and validate rolling RBLXValue request budget
        id: restore-budget
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/robase-daily-history:refs/remotes/origin/robase-daily-history
          mkdir -p data
          if git cat-file -e refs/remotes/origin/robase-daily-history:data/rblxvalue_request_budget.json 2>/dev/null; then
            git show refs/remotes/origin/robase-daily-history:data/rblxvalue_request_budget.json > data/rblxvalue_request_budget.json
            mkdir -p /tmp/rblxvalue-budget-check
            cp data/rblxvalue_request_budget.json /tmp/rblxvalue-budget-check/
            python tools/validate_state.py --directory /tmp/rblxvalue-budget-check --api-safety-only
            echo "[rblxvalue-budget] restored persistent rolling 24-hour request ledger"
          else
            echo "[rblxvalue-budget] no prior ledger; first request will create it"
          fi
      - name: Load exact ROBASE weapon crosswalk
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin robase-daily-history:refs/remotes/origin/robase-daily-history
          git show origin/robase-daily-history:data/weapon_identity_map.json > /tmp/weapon_identity_map.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/weapon_identity_map.json").read_text(encoding="utf-8"))
          if not isinstance(data, dict) or len(data) != 214:
              raise SystemExit("Expected exactly 214 weapon identities")
          print(f"Loaded {len(data)} exact ROBASE weapon identities")
          PY
      - name: Fetch RBLXValue API dataset
        env:
          RBLXVALUE_API_KEY: ${{ secrets.RBLXVALUE_API_KEY }}
          RBLXVALUE_DAILY_REQUEST_LIMIT: "60"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RBLXVALUE_API_KEY:-}" ]; then
            echo "::error::Missing repository secret RBLXVALUE_API_KEY. Add a valid key from the official RBLXValue developer portal."
            exit 1
          fi
          echo "::add-mask::${RBLXVALUE_API_KEY}"
          python tools/rblxvalue_daily.py --identity-map /tmp/weapon_identity_map.json --json-output /tmp/rblxvalue_latest.json --csv-output /tmp/rblxvalue_snapshot.csv
      - name: Upload rolling request budget even if collection fails
        if: always() && steps.restore-budget.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rblxvalue-request-budget
          path: data/rblxvalue_request_budget.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload validated snapshot for isolated archive job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rblxvalue-validated-snapshot
          path: |
            /tmp/rblxvalue_latest.json
            /tmp/rblxvalue_snapshot.csv
          if-no-files-found: error
          retention-days: 1

  persist-budget:
    name: Persist rolling API request budget (no API secret)
    needs: collect
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out archive branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: robase-daily-history
          fetch-depth: 0
          persist-credentials: true
      - name: Download request budget artifact
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: rblxvalue-request-budget
          path: /tmp/rblxvalue-budget
      - name: Validate and persist request budget
        env:
          COLLECT_RESULT: ${{ needs.collect.result }}
        shell: bash
        run: |
          set -euo pipefail
          budget="/tmp/rblxvalue-budget/rblxvalue_request_budget.json"
          if [ ! -f "$budget" ]; then
            if [ "$COLLECT_RESULT" = "success" ]; then
              echo "::error::Successful collection did not upload its rolling request budget."
              exit 1
            fi
            echo "No request ledger was created before collection failed; nothing to persist."
            exit 0
          fi
          mkdir -p /tmp/rblxvalue-budget-check data
          cp "$budget" /tmp/rblxvalue-budget-check/
          python tools/validate_state.py --directory /tmp/rblxvalue-budget-check --api-safety-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin refs/heads/robase-daily-history:refs/remotes/origin/robase-daily-history
            git reset --hard refs/remotes/origin/robase-daily-history
            mkdir -p data
            cp "$budget" data/rblxvalue_request_budget.json
            git add -f data/rblxvalue_request_budget.json
            if git diff --cached --quiet; then
              echo "Rolling RBLXValue request budget unchanged."
              exit 0
            fi
            git commit -m "chore: persist RBLXValue rolling request budget"
            if git push origin HEAD:robase-daily-history; then
              exit 0
            fi
            echo "::warning::Budget ledger push raced with another archive writer; retrying ($attempt/3)."
            sleep 2
          done
          echo "::error::Could not persist rolling RBLXValue request budget after three attempts."
          exit 1

  archive:
    name: Archive snapshot (no API secret)
    needs: [collect, persist-budget]
    if: needs.collect.result == 'success' && needs.persist-budget.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out archive branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: robase-daily-history
          fetch-depth: 0
          persist-credentials: true
      - name: Download validated snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rblxvalue-validated-snapshot
          path: /tmp/rblxvalue-snapshot
      - name: Validate and append snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("/tmp/rblxvalue-snapshot")
          latest = json.loads((root/"rblxvalue_latest.json").read_text(encoding="utf-8"))
          incoming = list(csv.DictReader((root/"rblxvalue_snapshot.csv").open(encoding="utf-8", newline="")))
          if len(incoming) != 214 or latest.get("expected_weapons") != 214:
              raise SystemExit("Refusing incomplete RBLXValue snapshot")
          source_fields = latest.get("source_fields") or {}
          if source_fields.get("value_source_b") != "Supreme Values (exclusive trade-price source)":
              raise SystemExit("Refusing snapshot without Supreme-only trade-price attribution")
          for field in ("stability", "demand", "rarity"):
              if source_fields.get(field) != "RBLXValue":
                  raise SystemExit(f"Refusing snapshot without RBLXValue-only {field} attribution")
          if source_fields.get("range") != "RBLXValue metadata; not used for trade-price bounds":
              raise SystemExit("Refusing snapshot that does not explicitly exclude provider ranges from Supreme pricing")
          authorization = latest.get("third_party_authorization") or {}
          if authorization.get("source") != "Supreme Values" or authorization.get("authorization_date") != "2026-11-26":
              raise SystemExit("Refusing snapshot without the recorded Supreme Values authorization metadata")
          if authorization.get("attribution") != "Supreme Values (supremevalues.com)":
              raise SystemExit("Refusing snapshot without the required Supreme Values attribution")
          if {row.get("snapshot_date") for row in incoming} != {latest.get("snapshot_date")}:
              raise SystemExit("CSV and JSON snapshot dates differ")
          data_dir = Path("data")
          latest_path, history_path, manifest_path = data_dir/"rblxvalue_latest.json", data_dir/"rblxvalue_daily_history.csv", data_dir/"rblxvalue_manifest.json"
          fields = list(incoming[0]); existing = []
          if history_path.exists():
              with history_path.open(encoding="utf-8", newline="") as handle:
                  reader = csv.DictReader(handle)
                  if reader.fieldnames != fields: raise SystemExit("History CSV schema mismatch")
                  existing = list(reader)
          day = latest["snapshot_date"]
          fetched_at = latest.get("fetched_at_utc")
          if not fetched_at or {row.get("fetched_at_utc") for row in incoming} != {fetched_at}:
              raise SystemExit("CSV and JSON fetch timestamps differ")
          # Keep both scheduled snapshots on the same Algeria-local date.
          # Replace only an exact rerun, never the other daily capture.
          combined = [
              row for row in existing
              if not (row.get("snapshot_date") == day and row.get("fetched_at_utc") == fetched_at)
          ] + incoming
          combined.sort(key=lambda row: (row["snapshot_date"], row["fetched_at_utc"], row["robase_slug"]))
          temp = history_path.with_suffix(".csv.tmp")
          with temp.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields); writer.writeheader(); writer.writerows(combined)
          temp.replace(history_path)
          latest_path.write_text(json.dumps(latest, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          manifest = {"schema_version":1,"source":latest["source"],"source_url":latest["source_url"],"third_party_authorization":authorization,"source_attribution":"Supreme Values (supremevalues.com)","dataset_last_updated":latest["dataset_last_updated"],"last_snapshot_date":day,"last_fetched_at_utc":fetched_at,"scheduled_runs_per_day":2,"scheduled_utc_times":["11:30","23:30"],"scheduled_algeria_times":["12:30","00:30 (next day)"],"expected_weapons":latest["expected_weapons"],"history_rows":len(combined),"snapshot_counts":latest["counts"],"usage":"Supreme via RBLXValue for research and optional Telegram reference display only; no cash valuation or alert decisions; source attribution required"}
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, sort_keys=True))
          PY
          # The archive branch ignores generated data/ by default; force-add only these three validated research outputs.
          git add -f data/rblxvalue_latest.json data/rblxvalue_daily_history.csv data/rblxvalue_manifest.json
          if git diff --cached --quiet; then
            echo "RBLXValue snapshot unchanged; no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: archive daily RBLXValue weapon values"
            git push origin HEAD:robase-daily-history
          fi
