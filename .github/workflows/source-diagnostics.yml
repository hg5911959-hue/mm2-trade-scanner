name: BloxSwaps Source Diagnostics

on:
  push:
    branches: [hardening/staged-audit-2026-11-12]

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public page data and pagination
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit, urlencode

          URL = "https://bloxswaps.com/fr/trade-mm2?trade-type=P2P"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/json",
              "Accept-Language": "en-US,en;q=0.9,fr;q=0.8",
          }
          class Capture(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.scripts, self.links, self.images = [], [], []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "script":
                      self.current = {"attrs": a, "text": ""}
                      self.scripts.append(self.current)
                  elif tag == "a" and a.get("href"):
                      self.links.append(a["href"])
                  elif tag == "img":
                      self.images.append(a)
              def handle_data(self, data):
                  if self.current is not None:
                      self.current["text"] += data
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.current = None

          req = urllib.request.Request(URL, headers=HEADERS)
          with urllib.request.urlopen(req, timeout=25) as response:
              raw = response.read()
              final_url = response.geturl()
              print("PAGE_STATUS", response.status, "CONTENT_TYPE", response.headers.get("Content-Type"))
          html = raw.decode("utf-8", "replace")
          print("PAGE_BYTES", len(raw), "FINAL_URL", final_url)
          low = html.casefold()
          for marker in ("cloudflare", "captcha", "challenge-platform", "__next_data__", "__next_f.push", "self.__next_f.push"):
              print("MARKER", marker, low.find(marker))
          parser = Capture()
          parser.feed(html)
          print("SCRIPT_COUNT", len(parser.scripts), "LINK_COUNT", len(parser.links), "IMAGE_COUNT", len(parser.images))
          print("SCRIPT_TAGS")
          rsc_payloads = []
          decoder = json.JSONDecoder()
          for script in parser.scripts:
              src = script["text"]
              cursor = 0
              marker = "self.__next_f.push([1,"
              while True:
                  pos = src.find(marker, cursor)
                  if pos < 0: break
                  try:
                      payload, consumed = decoder.raw_decode(src[pos + len(marker):])
                      if isinstance(payload, str): rsc_payloads.append(payload)
                      cursor = pos + len(marker) + consumed
                  except Exception:
                      cursor = pos + len(marker)
          def extract_object_after(text, marker):
              pos = text.find(marker)
              if pos < 0: return None
              start = text.find("{", pos + len(marker))
              if start < 0: return None
              depth, quoted, escaped = 0, False, False
              for i in range(start, len(text)):
                  ch = text[i]
                  if quoted:
                      if escaped: escaped = False
                      elif ch == "\\\\": escaped = True
                      elif ch == '"': quoted = False
                  else:
                      if ch == '"': quoted = True
                      elif ch == "{": depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              try: return json.loads(text[start:i+1])
                              except Exception: return None
              return None
          discovered_cursor = None
          for i, payload in enumerate(rsc_payloads):
              if "initialPage" in payload:
                  page_obj = extract_object_after(payload, '"initialPage":')
                  if isinstance(page_obj, dict):
                      print("RSC_INITIAL_PAGE_KEYS", list(page_obj))
                      items = page_obj.get("items", [])
                      print("RSC_INITIAL_PAGE_ITEM_COUNT", len(items))
                      print("RSC_PAGE_META", {k:v for k,v in page_obj.items() if k != "items"})
                      discovered_cursor = (page_obj.get("meta") or {}).get("cursor")
                      for item in items[:12]:
                          print("RSC_LISTING", json.dumps({
                              "id": item.get("id"),
                              "keys": list(item),
                              "tradePostItems": item.get("tradePostItems"),
                              "requestedWildcards": item.get("requestedWildcards"),
                          }, ensure_ascii=False)[:2400])
                  else:
                      print("RSC_INITIAL_PAGE_PARSE_FAILED", i, payload.find('"initialPage":'))
          print("TRADE_POST_LINKS", [x for x in parser.links if "trade-mm2" in x or "ad=" in x][:50])
          if discovered_cursor:
              candidate_urls = [
                  "https://bloxswaps.com/api/trade-posts?" + urlencode({"cursor": discovered_cursor}),
                  "https://api.bloxswaps.com/trade-posts?" + urlencode({"cursor": discovered_cursor}),
                  "https://api.bloxswaps.com/api/trade-posts?" + urlencode({"cursor": discovered_cursor}),
                  "https://bloxswaps.com/api/v1/trade-posts?" + urlencode({"cursor": discovered_cursor}),
              ]
              for endpoint in candidate_urls:
                  try:
                      rq = urllib.request.Request(endpoint, headers=HEADERS)
                      with urllib.request.urlopen(rq, timeout=20) as response:
                          body = response.read()
                          data = json.loads(body.decode("utf-8", "replace"))
                      payload = data.get("data", data)
                      print("PAGINATION_API_OK", endpoint.split("?")[0], "keys", list(payload) if isinstance(payload, dict) else type(payload).__name__)
                      print("PAGINATION_API_PAGE", json.dumps({
                          "count": len(payload.get("items", [])) if isinstance(payload, dict) else None,
                          "meta": payload.get("meta") if isinstance(payload, dict) else None,
                          "first_ids": [x.get("id") for x in payload.get("items", [])[:3]] if isinstance(payload, dict) else None
                      }, ensure_ascii=False)[:1500])
                      if isinstance(payload, dict) and payload.get("items"):
                          break
                  except urllib.error.HTTPError as e:
                      print("PAGINATION_API_FAIL", endpoint.split("?")[0], e.code, e.read(800).decode("utf-8", "replace")[:800])
                  except Exception as e:
                      print("PAGINATION_API_FAIL", endpoint.split("?")[0], type(e).__name__, str(e)[:200])
          print("PAGINATION_LINKS", [x for x in parser.links if re.search(r"page|cursor|offset|next", x, re.I)][:80])
          print("PAGE_QUERY_HINTS", sorted(set(re.findall(r"(?i)(?:page|cursor|offset|limit|take|skip)[A-Za-z0-9_]*", html)))[:80])
          print("APP_DATA_MARKERS", [m for m in re.findall(r"(?i)(?:/api/|graphql|trades|listings)[^\\\"'\\s]{0,140}", html)[:80]])
          scripts = [urljoin(final_url, s["attrs"]["src"]) for s in parser.scripts if s["attrs"].get("src")]
          print("SCRIPT_URLS", scripts[:100])
          for script_url in scripts:
              if urlsplit(script_url).netloc != "bloxswaps.com": continue
              try:
                  rq = urllib.request.Request(script_url, headers=HEADERS)
                  with urllib.request.urlopen(rq, timeout=12) as response:
                      js = response.read(3_000_000).decode("utf-8", "replace")
                  for term in ("baseURL", "api.create", "NEXT_PUBLIC_API", "api.bloxswaps", "tradePosts.search", "useSearchTradePosts", "toSearchParams", "/trade-posts"):
                      positions = [m.start() for m in re.finditer(re.escape(term), js)]
                      for p in positions[:3]:
                          print("TRADE_API_CONTEXT", term, script_url, " ".join(js[max(0,p-700):p+1300].split())[:2200])
                  patterns = re.findall(r"""(?:"|')((?:/api/|/trpc/|/graphql)[^"'\\s]{0,160})(?:"|')""", js)
                  if patterns: print("BUNDLE_ENDPOINTS", script_url, patterns[:80])
              except Exception as e:
                  print("BUNDLE_FETCH_ERROR", script_url, type(e).__name__)
          with open("bloxswaps-live.html", "wb") as f:
              f.write(raw)
          with open("bloxswaps-page-metadata.json", "w", encoding="utf-8") as f:
              json.dump({"final_url": final_url, "scripts": parser.scripts, "links": parser.links, "images": parser.images}, f, ensure_ascii=False, indent=2)
          PY
      - name: Upload public page snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bloxswaps-source-diagnostics
          path: |
            bloxswaps-live.html
            bloxswaps-page-metadata.json
          retention-days: 3
