name: MM2 Trade Scanner

on:
  workflow_call:
    inputs:
      verify_rblxvalue_key:
        description: "Send exactly one small /v2/items request to verify the configured API key"
        required: false
        type: boolean
        default: false
      enable_discord:
        description: "Enable authorized Discord collection and parsing; requires the existing Telegram bot token for encrypted private state"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Evaluate and log opportunities without sending Telegram messages or recording alerts"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      verify_rblxvalue_key:
        description: "Send exactly one small /v2/items request to verify the configured API key"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Evaluate and log opportunities without sending Telegram messages or recording alerts"
        required: false
        type: boolean
        default: true
permissions:
  # State persistence requires write; individual jobs below reduce permissions
  # where they do not need to publish the durable state branch.
  contents: write

concurrency:
  group: mm2-trade-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      CASH_FILTER: "false" # set to true only after fresh verified prices exist
      MARKET_BOOK_ENABLED: "false"
      TELEGRAM_COMMANDS_ENABLED: "false"
      INVENTORY_ENABLED: "false"
      PRIVATE_STATE_ENABLED: ${{ inputs.enable_discord && 'true' || 'false' }}
      MAX_ALERTS_PER_SCAN: "15"
      MARKET_ALERT_PROFIT_DELTA_USD: "0.50"
      MARKET_TRANSFER_FEE_USD: "0.50"
      MARKET_SAFETY_MARGIN_PERCENT: "5.0"
      MIN_PROFIT_USD: "0.50"
      MIN_PROFIT_PERCENT: "5.0"
      SWAP_VALUE_TOLERANCE_PERCENT: "2.0"
      MARKET_OFFER_MAX_AGE_HOURS: "48"
      MARKET_LOW_PRICE_RATIO: "0.40"
      MARKET_HIGH_PRICE_RATIO: "2.50"
      MARKET_UNDERCUT_USD: "0.01"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore durable state branch
        run: |
          set -euo pipefail
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            rm -rf data
            mkdir -p data
            # Keep the cash catalogue untouched when restoring durable runtime state.
            git archive origin/state data | tar --exclude='data/cash_prices.csv' -x
            echo "Restored scanner state from branch 'state'."
          else
            echo "State branch not found; cold-start safety window will evaluate recent posts."
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/supreme_values.json")
          if not path.exists():
              print("[state-audit] supreme_cache_present=false")
          else:
              raw = path.read_bytes()
              try:
                  cache = json.loads(raw)
                  pages = cache.get("pages", {})
                  etags = sum(1 for page in pages.values() if isinstance(page, dict) and page.get("etag"))
                  print(
                      f"[state-audit] supreme_cache_present=true bytes={len(raw)} "
                      f"schema={cache.get('schema_version')} pages={len(pages)} etag_pages={etags} "
                      f"fetched_at_epoch={cache.get('fetched_at')}"
                  )
              except Exception as exc:
                  print(f"[state-audit] supreme_cache_present=true bytes={len(raw)} parse_error={type(exc).__name__}")
          PY

      - name: Decrypt private market state
        id: decrypt-private-state
        if: env.PRIVATE_STATE_ENABLED == 'true'
        env:
          MM2_PRIVATE_STATE_KEY: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${#MM2_PRIVATE_STATE_KEY}" -lt 32 ]; then
            echo "::error::Discord processing requires the existing Telegram bot token for encrypted private state."
            exit 1
          fi
          if [ -f data/private_state.enc ]; then
            python private_state.py decrypt --input data/private_state.enc --directory data
          else
            for file in cash_market_offers.json inventory.json telegram_update_state.json telegram_last_run.json market_book_history.json market_alert_state.json discord_alert_state.json; do
              if [ -f "data/$file" ]; then
                echo "Refusing unencrypted private state on the public state branch."
                exit 1
              fi
            done
            echo "No previous encrypted private market state exists."
          fi

      - name: Run scanner preflight checks (warnings do not block the scan)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREFLIGHT_SEND_NOTICES: ${{ inputs.dry_run && 'false' || 'true' }}
          CASH_PRICES_CSV: ${{ (env.CASH_FILTER == '1' || env.CASH_FILTER == 'true' || env.CASH_FILTER == 'yes' || env.CASH_FILTER == 'on') && secrets.CASH_PRICES_CSV || '' }}
          CASH_MIN_VERIFIED_ROWS: "8"
        continue-on-error: true
        run: python -m tools.preflight --warn

      - name: Collect authorized Discord trade channels
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_IDS: "1125462206151143464,482699890741477376"
          DISCORD_MANUAL_MESSAGES_JSON: ${{ secrets.DISCORD_MANUAL_MESSAGES_JSON }}
          DISCORD_MANUAL_MESSAGES_JSON_2: ${{ secrets.DISCORD_MANUAL_MESSAGES_JSON_2 }}
        run: |
          if [ -n "$DISCORD_BOT_TOKEN" ]; then
            if ! python -u discord_collector.py --output data/discord_messages.json --limit 100 --retention-days 7; then
              echo "Discord collector failed; continuing with BloxSwaps and any manual import."
            fi
          else
            echo "Discord bot collection skipped: DISCORD_BOT_TOKEN is not configured."
          fi
          # message contents are not logged or persisted to public state
          python tools/merge_discord_imports.py

      - name: Run BloxSwaps scanner
        id: scan
        env:
          BLOXSWAPS_URL: "https://bloxswaps.com/fr/trade-mm2?trade-type=P2P"
          MIN_VALUE_DIFFERENCE: "0"
          MIN_PROFIT_PERCENT: "5"
          FAILURE_ALERT_THRESHOLD: "3"
          MAX_ALERTS_PER_RUN: "0"
          MAX_ALERTS_PER_SCAN: "15"
          CASH_MAX_AGE_DAYS: "14"
          MAX_PENDING_RECHECK_PER_SCAN: "50"
          MAX_BACKLOG_RECHECK_PAGES: "25"
          BACKLOG_RECHECK_EVERY_CYCLES: "4"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          MAX_ALERTS_PER_SESSION: "0"
          MM2_SCAN_DURATION_SECONDS: "540"
          MM2_SCAN_INTERVAL_SECONDS: "30"
          ALERT_DELAY_SECONDS: "1.1"
          MAX_FEED_PAGES: "1000"
          VALUES_TTL_SECONDS: "43200"
          RBLXVALUE_META_POLL_ENABLED: "true"
          RBLXVALUE_MAX_DETAIL_LOOKUPS_PER_DAY: "6"
          RBLXVALUE_DAILY_REQUEST_LIMIT: "60"
          RBLXVALUE_MAX_CACHE_AGE_SECONDS: "86400"
          MARKET_BOOK_ENABLED: ${{ env.MARKET_BOOK_ENABLED }}
          TELEGRAM_COMMANDS_ENABLED: ${{ env.TELEGRAM_COMMANDS_ENABLED }}
          INVENTORY_ENABLED: ${{ env.INVENTORY_ENABLED }}
          PRIVATE_STATE_ENABLED: ${{ env.PRIVATE_STATE_ENABLED }}
          LANG: "ar"
          RBLXVALUE_FORCE_KEY_CHECK: ${{ inputs.verify_rblxvalue_key && 'true' || 'false' }}
          BLOXSWAPS_ITEMS_TTL_SECONDS: "3600"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RBLXVALUE_API_KEY: ${{ secrets.RBLXVALUE_API_KEY }}
          CASH_PRICES_CSV: ${{ (env.CASH_FILTER == '1' || env.CASH_FILTER == 'true' || env.CASH_FILTER == 'yes' || env.CASH_FILTER == 'on') && secrets.CASH_PRICES_CSV || '' }}
        run: |
          mkdir -p data
          if [[ "${CASH_FILTER,,}" =~ ^(1|true|yes|on)$ ]] && [ -n "$CASH_PRICES_CSV" ]; then
            python - <<'PY'
          import csv, io, os, tempfile
          from pathlib import Path
          raw = os.environ["CASH_PRICES_CSV"]
          reader = csv.DictReader(io.StringIO(raw))
          required = {"name", "cash_price_usd", "tier", "status", "verified_at_utc", "source", "notes"}
          if not reader.fieldnames or not required.issubset(reader.fieldnames):
              raise SystemExit("CASH_PRICES_CSV has an invalid header; tracked fallback retained.")
          path = Path("data/cash_prices.csv")
          fd, temp = tempfile.mkstemp(prefix="cash_prices.", suffix=".tmp", dir="data")
          with os.fdopen(fd, "w", encoding="utf-8", newline="") as handle:
              handle.write(raw)
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(temp, path)
          print("[cash] Loaded private price catalogue secret; contents suppressed.")
          PY
          fi
          set -o pipefail
          python -u scanner.py 2>&1 | tee scanner.log

      - name: Send external uptime heartbeat
        if: always() && env.HEALTHCHECKS_PING_URL != ''
        run: |
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            curl --fail --silent --show-error "$HEALTHCHECKS_PING_URL"
          else
            curl --fail --silent --show-error "$HEALTHCHECKS_PING_URL/fail"
          fi

      - name: Prepare state artifact
        if: always() && (env.PRIVATE_STATE_ENABLED != 'true' || steps.decrypt-private-state.outcome == 'success')
        env:
          MM2_PRIVATE_STATE_KEY: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${PRIVATE_STATE_ENABLED}" = "true" ]; then
            python private_state.py encrypt --directory data --output data/private_state.enc
          else
            rm -f data/cash_market_offers.json data/inventory.json data/telegram_update_state.json data/telegram_last_run.json data/market_book_history.json data/market_alert_state.json data/discord_alert_state.json
          fi
          mkdir -p state-bundle/data
          if [ -d data ]; then cp -a data/. state-bundle/data/; fi
          # Discord messages may come from private servers; process them in this
          # job only and never publish raw message bodies to the public state branch.
          rm -f state-bundle/data/discord_messages.json state-bundle/data/discord_messages.json.tmp
          # Never persist the manually maintained cash-price catalogue to state.
          rm -f state-bundle/data/cash_prices.csv
          printf '%s\n' "${GITHUB_SHA}" > state-bundle/source-commit.txt

      - name: Upload durable state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mm2-scanner-state
          path: state-bundle/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload scanner diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mm2-scanner-diagnostics
          path: scanner.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare API safety ledger artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p api-safety-bundle/data
          for file in rblxvalue_request_budget.json api_key_blocked.json; do
            if [ -f "data/$file" ]; then
              cp "data/$file" "api-safety-bundle/data/$file"
            fi
          done

      - name: Upload API safety ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mm2-api-safety-ledger
          path: api-safety-bundle/
          if-no-files-found: ignore
          retention-days: 1

  persist-state:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download scanner state
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mm2-scanner-state
          path: state-artifact

      - name: Download API safety ledger
        id: safety-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mm2-api-safety-ledger
          path: api-safety-artifact

      - name: Validate API safety ledger independently
        id: validate-api-safety
        if: steps.safety-download.outcome == 'success'
        run: |
          set -euo pipefail
          python tools/validate_state.py --directory api-safety-artifact/data --api-safety-only

      - name: Validate downloaded scanner state before publishing
        id: validate-state
        if: needs.scan.result == 'success' && steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          # Never replace the durable branch with a partial artifact, even if
          # the scan failed. The previous cache/database must survive failures.
          python tools/validate_state.py --directory state-artifact/data --require-cache

      - name: Verify encrypted private-state authentication
        id: verify-private-state
        if: steps.download.outcome == 'success' && hashFiles('state-artifact/data/private_state.enc') != ''
        env:
          MM2_PRIVATE_STATE_KEY: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          python private_state.py decrypt --input state-artifact/data/private_state.enc --directory "$verify_dir"
          echo "Authenticated encrypted private-state bundle verified; plaintext stayed in temporary runner storage."

      - name: Persist API safety ledger after failed scan
        id: persist-api-safety
        if: needs.scan.result != 'success' && steps.safety-download.outcome == 'success' && steps.validate-api-safety.outcome == 'success' && hashFiles('api-safety-artifact/data/*.json') != ''
        run: |
          set -euo pipefail
          if [ ! -d api-safety-artifact/data ] || ! find api-safety-artifact/data -type f -print -quit | grep -q .; then
            echo "No API safety ledger changes to persist."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            git checkout --detach origin/state
          else
            git checkout --orphan state-safety
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          for file in rblxvalue_request_budget.json api_key_blocked.json; do
            if [ -f "api-safety-artifact/data/$file" ]; then
              cp "api-safety-artifact/data/$file" "data/$file"
              git add "data/$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "API safety ledger unchanged; no state-branch update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(state): persist API safety ledger after failed scan"
          git push origin HEAD:state
          echo "Persisted only validated API safety files; previous market cache remains untouched."

      - name: Persist encrypted private state after failed scan
        if: needs.scan.result != 'success' && steps.download.outcome == 'success' && steps.verify-private-state.outcome == 'success' && hashFiles('state-artifact/data/private_state.enc') != ''
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("state-artifact/data/private_state.enc"); d=p.read_bytes(); assert d.startswith(b"MM2PSTATE1") and len(d) >= 74'
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            git checkout --detach origin/state
          else
            git checkout --orphan state-private
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp state-artifact/data/private_state.enc data/private_state.enc
          git add data/private_state.enc
          if git diff --cached --quiet; then
            echo "Encrypted private state unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(state): persist encrypted private market state"
          git push origin HEAD:state
          echo "Persisted encrypted private state only; plaintext was not published."

      - name: Verify API safety ledger after failed scan
        if: steps.persist-api-safety.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin refs/heads/state:refs/remotes/origin/state
          for file in rblxvalue_request_budget.json api_key_blocked.json; do
            if [ -f "api-safety-artifact/data/$file" ]; then
              git cat-file -e "refs/remotes/origin/state:data/$file"
              echo "[api-safety-persist-audit] verified=$file"
            fi
          done

      - name: Persist state branch
        id: persist-state
        if: steps.download.outcome == 'success' && steps.validate-state.outcome == 'success' && (steps.verify-private-state.outcome == 'success' || steps.verify-private-state.outcome == 'skipped')
        run: |
          set -euo pipefail
          if [ ! -d state-artifact/data ]; then
            echo "No scanner data artifact found; leaving durable state unchanged."
            exit 0
          fi
          if ! find state-artifact/data -type f -print -quit | grep -q .; then
            echo "No scanner data files found; leaving durable state unchanged."
            exit 0
          fi
          rm -rf /tmp/mm2-state-data
          mkdir -p /tmp/mm2-state-data
          cp -a state-artifact/data/. /tmp/mm2-state-data/
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            git checkout --detach origin/state
            rm -rf data
            mkdir -p data
            cp -a /tmp/mm2-state-data/. data/
            git add -A data
            if git diff --cached --quiet; then
              echo "Scanner state unchanged; no state-branch replacement needed."
              exit 0
            fi
          else
            git checkout --detach "${GITHUB_SHA}"
          fi
          git checkout --orphan state-new
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf data
          mkdir -p data
          cp -a /tmp/mm2-state-data/. data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "chore(state): persist MM2 scanner state"
          git push --force origin state-new:state
          echo "Replaced durable scanner state with a single-commit history."

      - name: Verify durable RBLXValue state
        if: steps.persist-state.outcome == 'success'
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            echo "State branch is not available for verification."
            exit 1
          fi
          git fetch origin refs/heads/state:refs/remotes/origin/state
          for file in data/supreme_values.json data/rblxvalue_request_budget.json data/api_key_blocked.json data/rblxvalue_key_health.json data/market_history.sqlite3 data/private_state.enc; do
            if git cat-file -e "refs/remotes/origin/state:$file" 2>/dev/null; then
              bytes="$(git cat-file -s "refs/remotes/origin/state:$file")"
              echo "[state-persist-audit] present=$file bytes=$bytes"
            else
              echo "[state-persist-audit] absent=$file"
            fi
          done
