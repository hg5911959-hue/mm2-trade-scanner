name: MM2 Trade Scanner

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [mm2-scan]

permissions:
  contents: read

concurrency:
  group: mm2-trade-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Restore durable state branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            rm -rf data
            mkdir -p data
            git archive origin/state data | tar -x
            echo "Restored scanner state from branch 'state'."
          else
            echo "State branch not found; cold-start safety window will evaluate recent posts."
          fi

      - name: Run BloxSwaps scanner
        id: scan
        env:
          BLOXSWAPS_URL: "https://bloxswaps.com/fr/trade-mm2?trade-type=P2P"
          MIN_VALUE_DIFFERENCE: "0"
          MIN_PROFIT_PERCENT: "0"
          FAILURE_ALERT_THRESHOLD: "3"
          MAX_ALERTS_PER_RUN: "3"
          MAX_ALERTS_PER_SESSION: "3"
          MM2_SCAN_DURATION_SECONDS: "570"
          MM2_SCAN_INTERVAL_SECONDS: "45"
          ALERT_DELAY_SECONDS: "2"
          MAX_FEED_PAGES: "50"
          VALUES_TTL_SECONDS: "300"
          BLOXSWAPS_ITEMS_TTL_SECONDS: "3600"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RBLXVALUE_API_KEY: ${{ secrets.RBLXVALUE_API_KEY }}
        run: |
          mkdir -p data
          set -o pipefail
          python -u scanner.py 2>&1 | tee scanner.log

      - name: Send external uptime heartbeat
        if: always() && env.HEALTHCHECKS_PING_URL != ''
        run: |
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            curl --fail --silent --show-error "$HEALTHCHECKS_PING_URL"
          else
            curl --fail --silent --show-error "$HEALTHCHECKS_PING_URL/fail"
          fi

      - name: Prepare state artifact
        if: always()
        run: |
          mkdir -p state-bundle/data
          if [ -d data ]; then cp -a data/. state-bundle/data/; fi
          printf '%s\n' "${GITHUB_SHA}" > state-bundle/source-commit.txt

      - name: Upload durable state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mm2-scanner-state
          path: state-bundle/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload scanner diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mm2-scanner-diagnostics
          path: scanner.log
          if-no-files-found: warn
          retention-days: 7

  persist-state:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download scanner state
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mm2-scanner-state
          path: state-artifact

      - name: Persist state branch
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -d state-artifact/data ]; then
            echo "No scanner data artifact found; leaving durable state unchanged."
            exit 0
          fi
          rm -rf /tmp/mm2-state-data
          mkdir -p /tmp/mm2-state-data
          cp -a state-artifact/data/. /tmp/mm2-state-data/
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            git checkout --detach origin/state
            rm -rf data
            mkdir -p data
            cp -a /tmp/mm2-state-data/. data/
            git add -A data
            if git diff --cached --quiet; then
              echo "Scanner state unchanged; no state-branch replacement needed."
              exit 0
            fi
          else
            git checkout --detach "${GITHUB_SHA}"
          fi
          git checkout --orphan state-new
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf data
          mkdir -p data
          cp -a /tmp/mm2-state-data/. data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "chore(state): persist MM2 scanner state"
          git push --force origin state-new:state
          echo "Replaced durable scanner state with a single-commit history."
