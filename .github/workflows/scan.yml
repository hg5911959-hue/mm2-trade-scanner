name: MM2 Trade Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mm2-trade-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/seen.json
            data/supreme_values.json
            data/failure_state.json
            data/history.csv
          key: mm2-state-\${{ github.run_id }}-\${{ github.run_attempt }}
          restore-keys: |
            mm2-state-

      - name: Run BloxSwaps scanner
        env:
          BLOXSWAPS_URL: "https://bloxswaps.com/fr/trade-mm2?trade-type=P2P"
          MIN_VALUE_DIFFERENCE: "0"
          MIN_PROFIT_PERCENT: "0"
          FAILURE_ALERT_THRESHOLD: "3"
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
          RBLXVALUE_API_KEY: \${{ secrets.RBLXVALUE_API_KEY }}
        run: |
          mkdir -p data
          set -o pipefail
          python -u scanner.py 2>&1 | tee scanner.log

      - name: Upload scanner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm2-scanner-diagnostics
          path: scanner.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/seen.json
            data/supreme_values.json
            data/failure_state.json
            data/history.csv
          key: mm2-state-\${{ github.run_id }}-\${{ github.run_attempt }}
