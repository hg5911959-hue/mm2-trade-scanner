name: MM2 Trade Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [mm2-scan]

permissions:
  contents: write

concurrency:
  group: mm2-trade-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/
          key: mm2-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mm2-state-

      - name: Restore durable state branch
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            rm -rf data
            mkdir -p data
            git archive origin/state data | tar -x
            echo "Restored scanner state from branch 'state'."
          else
            echo "State branch not found; retaining legacy Actions Cache state for one-time migration."
          fi

      - name: Test parser and value calculations
        run: python -m unittest discover -s tests -q

      - name: Record test failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from scanner import record_failure; record_failure('Unit tests failed before scan')"

      - name: Run BloxSwaps scanner
        id: scan
        env:
          BLOXSWAPS_URL: "https://bloxswaps.com/fr/trade-mm2?trade-type=P2P"
          MIN_VALUE_DIFFERENCE: "0"
          MIN_PROFIT_PERCENT: "0"
          FAILURE_ALERT_THRESHOLD: "3"
          MAX_ALERTS_PER_RUN: "3"
          ALERT_DELAY_SECONDS: "2"
          MAX_FEED_PAGES: "50"
          VALUES_TTL_SECONDS: "300"
          BLOXSWAPS_ITEMS_TTL_SECONDS: "3600"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RBLXVALUE_API_KEY: ${{ secrets.RBLXVALUE_API_KEY }}
        run: |
          mkdir -p data
          set -o pipefail
          python -u scanner.py 2>&1 | tee scanner.log

      - name: Send external uptime heartbeat
        if: always() && env.HEALTHCHECKS_PING_URL != ''
        run: |
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            curl --fail --silent --show-error "$HEALTHCHECKS_PING_URL"
          else
            curl --fail --silent --show-error "$HEALTHCHECKS_PING_URL/fail"
          fi

      - name: Upload scanner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mm2-scanner-diagnostics
          path: scanner.log
          if-no-files-found: warn
          retention-days: 7

      - name: Persist durable state branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            git worktree add -B state /tmp/mm2-state origin/state
          else
            git worktree add --detach /tmp/mm2-state HEAD
            cd /tmp/mm2-state
            git checkout --orphan state
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi
          rm -rf /tmp/mm2-state/data
          mkdir -p /tmp/mm2-state/data
          if [ -d data ]; then cp -a data/. /tmp/mm2-state/data/; fi
          cd /tmp/mm2-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Scanner state unchanged; no state-branch commit created."
          else
            git commit -m "chore(state): persist MM2 scanner state"
            git push origin state
            echo "Updated durable scanner state branch."
          fi

