name: MM2 Trade Scanner

on:
  workflow_call:
    inputs:
      verify_rblxvalue_key:
        description: "Send exactly one small /v2/items request to verify the configured API key"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Evaluate and log opportunities without sending Telegram messages or recording alerts"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      verify_rblxvalue_key:
        description: "Send exactly one small /v2/items request to verify the configured API key"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Evaluate and log opportunities without sending Telegram messages or recording alerts"
        required: false
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: mm2-trade-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore durable state branch
        run: |
          set -euo pipefail
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            rm -rf data
            mkdir -p data
            git archive origin/state data | tar -x
            # Cash prices are tracked configuration, not durable runtime state.
            # Restore the current main-branch CSV after extracting old state.
            git checkout -- data/cash_prices.csv
            echo "Restored scanner state from branch 'state'."
          else
            echo "State branch not found; cold-start safety window will evaluate recent posts."
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/supreme_values.json")
          if not path.exists():
              print("[state-audit] supreme_cache_present=false")
          else:
              raw = path.read_bytes()
              try:
                  cache = json.loads(raw)
                  pages = cache.get("pages", {})
                  etags = sum(1 for page in pages.values() if isinstance(page, dict) and page.get("etag"))
                  print(
                      f"[state-audit] supreme_cache_present=true bytes={len(raw)} "
                      f"schema={cache.get('schema_version')} pages={len(pages)} etag_pages={etags} "
                      f"fetched_at_epoch={cache.get('fetched_at')}"
                  )
              except Exception as exc:
                  print(f"[state-audit] supreme_cache_present=true bytes={len(raw)} parse_error={type(exc).__name__}")
          PY

      - name: Collect authorized Discord trade channels
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_IDS: "1125462206151143464,482699890741477376"
          DISCORD_MANUAL_MESSAGES_JSON: ${{ secrets.DISCORD_MANUAL_MESSAGES_JSON }}
          DISCORD_MANUAL_MESSAGES_JSON_2: ${{ secrets.DISCORD_MANUAL_MESSAGES_JSON_2 }}
        run: |
          if [ -n "$DISCORD_BOT_TOKEN" ]; then
            if python -m pip install --disable-pip-version-check "discord.py==2.6.4"; then
              if ! python -u discord_collector.py --output data/discord_messages.json --limit 100 --retention-days 7; then
                echo "Discord collector failed; continuing with BloxSwaps and any manual import."
              fi
            else
              echo "discord.py install failed; continuing with BloxSwaps and any manual import."
            fi
          else
            echo "Discord bot collection skipped: DISCORD_BOT_TOKEN is not configured."
          fi
          # message contents are not logged or persisted to public state
          python tools/merge_discord_imports.py

      - name: Run BloxSwaps scanner
        id: scan
        env:
          BLOXSWAPS_URL: "https://bloxswaps.com/fr/trade-mm2?trade-type=P2P"
          MIN_VALUE_DIFFERENCE: "0"
          MIN_PROFIT_PERCENT: "5"
          FAILURE_ALERT_THRESHOLD: "3"
          MAX_ALERTS_PER_RUN: "0"
          MAX_ALERTS_PER_SCAN: "15"
          CASH_MAX_AGE_DAYS: "14"
          MAX_PENDING_RECHECK_PER_SCAN: "50"
          MAX_BACKLOG_RECHECK_PAGES: "25"
          BACKLOG_RECHECK_EVERY_CYCLES: "4"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          MAX_ALERTS_PER_SESSION: "0"
          MM2_SCAN_DURATION_SECONDS: "540"
          MM2_SCAN_INTERVAL_SECONDS: "30"
          ALERT_DELAY_SECONDS: "1.1"
          MAX_FEED_PAGES: "1000"
          VALUES_TTL_SECONDS: "43200"
          RBLXVALUE_META_POLL_ENABLED: "true"
          RBLXVALUE_MAX_DETAIL_LOOKUPS_PER_DAY: "6"
          RBLXVALUE_DAILY_REQUEST_LIMIT: "60"
          RBLXVALUE_FORCE_KEY_CHECK: ${{ inputs.verify_rblxvalue_key && 'true' || 'false' }}
          BLOXSWAPS_ITEMS_TTL_SECONDS: "3600"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RBLXVALUE_API_KEY: ${{ secrets.RBLXVALUE_API_KEY }}
        run: |
          mkdir -p data
          set -o pipefail
          python -u scanner.py 2>&1 | tee scanner.log

      - name: Send external uptime heartbeat
        if: always() && env.HEALTHCHECKS_PING_URL != ''
        run: |
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            curl --fail --silent --show-error "$HEALTHCHECKS_PING_URL"
          else
            curl --fail --silent --show-error "$HEALTHCHECKS_PING_URL/fail"
          fi

      - name: Prepare state artifact
        if: always()
        run: |
          mkdir -p state-bundle/data
          if [ -d data ]; then cp -a data/. state-bundle/data/; fi
          # Discord messages may come from private servers; process them in this
          # job only and never publish raw message bodies to the public state branch.
          rm -f state-bundle/data/discord_messages.json state-bundle/data/discord_messages.json.tmp
          # Never persist the manually maintained cash-price catalogue to state.
          rm -f state-bundle/data/cash_prices.csv
          printf '%s\n' "${GITHUB_SHA}" > state-bundle/source-commit.txt

      - name: Upload durable state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mm2-scanner-state
          path: state-bundle/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload scanner diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mm2-scanner-diagnostics
          path: scanner.log
          if-no-files-found: warn
          retention-days: 7

  persist-state:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download scanner state
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mm2-scanner-state
          path: state-artifact

      - name: Validate downloaded scanner state before publishing
        id: validate-state
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          # Never replace the durable branch with a partial artifact, even if
          # the scan failed. The previous cache/database must survive failures.
          python tools/validate_state.py --directory state-artifact/data --require-cache

      - name: Persist state branch
        id: persist-state
        if: steps.download.outcome == 'success' && steps.validate-state.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -d state-artifact/data ]; then
            echo "No scanner data artifact found; leaving durable state unchanged."
            exit 0
          fi
          if ! find state-artifact/data -type f -print -quit | grep -q .; then
            echo "No scanner data files found; leaving durable state unchanged."
            exit 0
          fi
          rm -rf /tmp/mm2-state-data
          mkdir -p /tmp/mm2-state-data
          cp -a state-artifact/data/. /tmp/mm2-state-data/
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            git checkout --detach origin/state
            rm -rf data
            mkdir -p data
            cp -a /tmp/mm2-state-data/. data/
            git add -A data
            if git diff --cached --quiet; then
              echo "Scanner state unchanged; no state-branch replacement needed."
              exit 0
            fi
          else
            git checkout --detach "${GITHUB_SHA}"
          fi
          git checkout --orphan state-new
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf data
          mkdir -p data
          cp -a /tmp/mm2-state-data/. data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "chore(state): persist MM2 scanner state"
          git push --force origin state-new:state
          echo "Replaced durable scanner state with a single-commit history."

      - name: Verify durable RBLXValue state
        if: steps.persist-state.outcome == 'success'
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            echo "State branch is not available for verification."
            exit 1
          fi
          git fetch origin refs/heads/state:refs/remotes/origin/state
          for file in data/supreme_values.json data/rblxvalue_request_budget.json data/api_key_blocked.json data/rblxvalue_key_health.json data/market_history.sqlite3; do
            if git cat-file -e "refs/remotes/origin/state:$file" 2>/dev/null; then
              bytes="$(git cat-file -s "refs/remotes/origin/state:$file")"
              echo "[state-persist-audit] present=$file bytes=$bytes"
            else
              echo "[state-persist-audit] absent=$file"
            fi
          done
