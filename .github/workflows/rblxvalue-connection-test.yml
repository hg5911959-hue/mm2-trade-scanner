name: RBLXValue API Connection Test

on:
  workflow_dispatch:
  # Run one non-secret-leaking live credential check when this workflow is
  # intentionally updated on main. This lets maintainers verify the stored
  # Actions secret without exposing it or requiring a manual UI dispatch.
  push:
    branches: [main]
    paths:
      - ".github/workflows/rblxvalue-connection-test.yml"

permissions:
  contents: read

concurrency:
  group: rblxvalue-api-connection-test
  cancel-in-progress: false

jobs:
  connection-test:
    name: Verify RBLXValue API credentials
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Test API authentication without exposing secrets
        env:
          RBLXVALUE_API_KEY: ${{ secrets.RBLXVALUE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("RBLXVALUE_API_KEY", "").strip()
          if not key:
              print("FAIL: GitHub Actions secret RBLXVALUE_API_KEY is missing or empty.")
              sys.exit(1)

          request = urllib.request.Request(
              "https://api.rblxvalue.com/v2/items?limit=1&offset=0",
              headers={
                  "X-Api-Key": key,
                  "Accept": "application/json",
                  "User-Agent": "MM2TradeScanner-ConnectionTest/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read(65536)
                  if response.status != 200:
                      print(f"FAIL: RBLXValue returned HTTP {response.status}.")
                      sys.exit(1)
                  try:
                      payload = json.loads(body.decode("utf-8"))
                  except Exception:
                      print("FAIL: RBLXValue returned HTTP 200 but invalid JSON.")
                      sys.exit(1)
                  if not isinstance(payload, dict) or not isinstance(payload.get("items"), list):
                      print("FAIL: RBLXValue returned HTTP 200 but unexpected response structure.")
                      sys.exit(1)
                  print(f"PASS: RBLXValue API authentication succeeded (HTTP 200; {len(payload['items'])} sample row(s)).")
          except urllib.error.HTTPError as exc:
              detail = exc.read(1200).decode("utf-8", errors="replace").strip()
              detail = detail.replace(key, "[REDACTED]")
              detail = re.sub(r"rbx_[A-Za-z0-9_-]+", "rbx_[REDACTED]", detail)
              detail = re.sub(r"(?i)(authorization\s*[:=]\s*bearer\s+)[^\s]+", r"\1[REDACTED]", detail)
              if exc.code == 403 and str(exc.headers.get("cf-mitigated", "")).casefold() == "challenge":
                  reason = "Cloudflare challenge"
              elif exc.code == 403:
                  reason = "upstream access denied (check whether the repository secret contains the current active key)"
              elif exc.code == 401:
                  reason = "unauthorized (the key sent by GitHub is missing, incorrect, or rotated)"
              elif exc.code == 429:
                  reason = "rate limited"
              else:
                  reason = "upstream request rejected"
              print(f"FAIL: HTTP {exc.code}: {reason}.")
              if detail and not detail.startswith("<"):
                  print(f"Safe response detail: {detail[:240]}")
              sys.exit(1)
          except Exception as exc:
              print(f"FAIL: connection test error: {type(exc).__name__}: {str(exc)[:200]}")
              sys.exit(1)
          PY
