name: ROBASE Daily Chart Shadow Validation

on:
  # Run automatically only after the daily archive has completed successfully.
  workflow_run:
    workflows: ["ROBASE daily All marketplaces history"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Evaluate yesterday's ROBASE chart prices without alerts
    permissions:
      contents: read
    uses: ./.github/workflows/scan.yml
    with:
      dry_run: true
      robase_daily_chart_shadow: true
