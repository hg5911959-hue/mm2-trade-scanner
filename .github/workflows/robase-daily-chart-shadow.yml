name: ROBASE Daily Chart Shadow Validation

on:
  # Run automatically only after the daily archive has completed successfully.
  workflow_run:
    workflows: ["ROBASE daily All marketplaces history"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  shadow:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Evaluate yesterday's ROBASE chart prices without alerts
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/scan-core.yml
    with:
      dry_run: true
      robase_daily_chart_shadow: true
