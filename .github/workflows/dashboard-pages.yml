name: Publish MM2 Market Dashboard

on:
  workflow_run:
    workflows: ["MM2 Trade Scanner", "MM2 Scanner Scheduler"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_enabled: ${{ steps.pages-preflight.outputs.enabled }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check whether GitHub Pages is enabled
        id: pages-preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/pages-response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "[pages] GitHub Pages is enabled; deployment may proceed."
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository. Dashboard data was built and the artifact uploaded, but deployment was skipped. Enable Pages in Settings > Pages and choose GitHub Actions as the source."
          else
            echo "[pages] Preflight failed with HTTP $status."
            head -c 500 /tmp/pages-response.json || true
            exit 1
          fi

      - name: Restore market history from state branch
        run: |
          set -euo pipefail
          mkdir -p data public
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            git archive origin/state data | tar -x
          else
            echo "State branch not found; publishing an empty dashboard until the first scan."
          fi

      - name: Export public dashboard data
        run: |
          python tools/export_dashboard.py --database data/market_history.sqlite3 --output public/dashboard-data.json
          cp docs/index.html public/index.html
          test -s public/dashboard-data.json
          test -s public/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public/

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
