name: Publish MM2 Market Dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dashboard-pages.yml"
      - "docs/**"
      - "tools/export_dashboard.py"
  workflow_run:
    workflows: ["MM2 Trade Scanner", "MM2 Scanner Scheduler"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline dashboard script, found {len(scripts)}")
          Path("/tmp/mm2-dashboard-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/mm2-dashboard-inline.js

      - name: Restore market history from state branch
        run: |
          set -euo pipefail
          mkdir -p data public
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin refs/heads/state:refs/remotes/origin/state
            git archive origin/state data | tar -x
          else
            echo "State branch not found; publishing an empty dashboard until the first scan."
          fi

      - name: Export public dashboard data
        run: |
          python tools/export_dashboard.py --database data/market_history.sqlite3 --output public/dashboard-data.json
          cp docs/index.html public/index.html
          test -s public/dashboard-data.json
          test -s public/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
