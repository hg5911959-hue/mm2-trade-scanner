name: Supreme Values Source Smoke Test

on:
  pull_request:
    paths:
      - "tools/supreme_values_daily.py"
      - "tests/test_supreme_values_daily.py"
      - ".github/workflows/supreme-values-source-smoke.yml"

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Load current exact ROBASE weapon crosswalk
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin robase-daily-history:refs/remotes/origin/robase-daily-history
          git show origin/robase-daily-history:data/weapon_identity_map.json > /tmp/weapon_identity_map.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/weapon_identity_map.json").read_text(encoding="utf-8"))
          if not isinstance(data, dict) or len(data) != 214:
              raise SystemExit("The current exact weapon crosswalk is not 214 rows")
          PY

      - name: Test live Supreme Values extraction without publishing or changing data
        run: |
          python tools/supreme_values_daily.py \
            --identity-map /tmp/weapon_identity_map.json \
            --json-output /tmp/supreme_values_smoke.json \
            --csv-output /tmp/supreme_values_smoke.csv

      - name: Upload source smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supreme-values-source-smoke
          path: |
            /tmp/supreme_values_smoke.json
            /tmp/supreme_values_smoke.csv
          if-no-files-found: ignore
          retention-days: 7
