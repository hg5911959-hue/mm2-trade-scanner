name: ROBASE chart source diagnostics

on:
  push:
    branches:
      - research/robase-chart-endpoint
  workflow_dispatch:
    inputs:
      item_slug:
        description: "ROBASE item page slug to inspect"
        required: false
        default: "heat"
        type: string

permissions:
  contents: read

jobs:
  inspect-public-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public page and same-origin JavaScript assets
        env:
          ITEM_SLUG: ${{ inputs.item_slug || 'heat' }}
        run: |
          python - <<'PY'
          import csv, html as html_lib, json, os, re
          from html.parser import HTMLParser
          from datetime import date, timedelta
          from urllib.parse import quote, urljoin, urlsplit
          from urllib.request import Request, urlopen

          slug = os.environ.get("ITEM_SLUG", "heat").strip()
          if not re.fullmatch(r"[a-z0-9-]{1,80}", slug):
              raise SystemExit("Invalid item slug")
          base = f"https://robase.gg/item/{slug}?days=365"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; ROBASEChartDiagnostics/1.0)"}

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
                  self.inline_scripts = []
                  self.in_inline_script = False
                  self.body_attrs = {}

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == "body":
                      self.body_attrs = attrs
                  if tag == "script":
                      if attrs.get("src"):
                          self.urls.append(urljoin(base, attrs["src"]))
                          self.in_inline_script = False
                      else:
                          self.inline_scripts.append("")
                          self.in_inline_script = True
                  elif tag == "link" and attrs.get("rel", "").lower() in ("modulepreload", "preload") and attrs.get("href"):
                      if attrs.get("as", "script") == "script":
                          self.urls.append(urljoin(base, attrs["href"]))

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.in_inline_script = False

              def handle_data(self, data):
                  if self.in_inline_script and self.inline_scripts:
                      self.inline_scripts[-1] += data

          def get(url, limit=2_000_000):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=20) as response:
                  data = response.read(limit + 1)
                  if len(data) > limit:
                      raise ValueError("response exceeds size cap")
                  return data.decode("utf-8", "replace")

          html = get(base)
          parser = Assets()
          parser.feed(html)
          origin = urlsplit(base).netloc
          scripts = [(f"inline-script-{i}", source) for i, source in enumerate(parser.inline_scripts) if source.strip()]
          for url in dict.fromkeys(parser.urls):
              parts = urlsplit(url)
              if parts.scheme != "https" or parts.netloc != origin:
                  continue
              try:
                  scripts.append((url, get(url, 2_000_000)))
              except Exception as exc:
                  print(f"ASSET_FETCH_FAILED {url}: {type(exc).__name__}: {exc}")

          patterns = re.compile(r"(?:fetch\s*\(|XMLHttpRequest|axios|/api/|graphql|price.?history|sales.?history|chart.?data|marketplace)", re.I)
          item_page_sections = []
          item_api_candidates = []
          for asset, source in scripts:
              start = source.find("function itemPage()")
              if start < 0:
                  continue
              end = source.find("// ---------- marketplaces", start)
              if end < 0:
                  end = min(len(source), start + 30000)
              section = source[start:end]
              item_page_sections.append({"asset": asset, "code": section[:40000], "section_length": len(section)})
              for match in re.finditer(r"""(?:getJson|fetch)\s*\(\s*(['"])(.*?)\1""", section, re.I):
                  item_api_candidates.append({"asset": asset, "call": match.group(0)[:1000]})
              for match in re.finditer(r"""['"]([^'"]*/api\.php[^'"]*)['"]""", section, re.I):
                  item_api_candidates.append({"asset": asset, "endpoint": match.group(1)[:1000]})
                  left, right = max(0, match.start()-350), min(len(section), match.end()+900)
                  item_api_candidates.append({"asset": asset, "context": section[left:right]})
          report = {
              "page": base,
              "page_bytes": len(html.encode()),
              "script_assets": [url for url, _ in scripts],
              "inline_script_count": len(parser.inline_scripts),
              "item_page_sections": item_page_sections,
              "item_api_candidates": item_api_candidates,
              "findings": [],
          }
          for url, source in scripts:
              for match in patterns.finditer(source):
                  start, end = max(0, match.start()-180), min(len(source), match.end()+320)
                  excerpt = re.sub(r"\s+", " ", source[start:end])
                  report["findings"].append({"asset": url, "excerpt": excerpt[:600]})
                  if len(report["findings"]) >= 100:
                      break
              if len(report["findings"]) >= 100:
                  break
          api_url = "https://robase.gg/api.php?item=" + quote(slug, safe="") + "&days=365"
          api_text = get(api_url, 5_000_000)
          api_data = json.loads(api_text)
          raw_fees = parser.body_attrs.get("data-fees", "{}")
          fees = json.loads(html_lib.unescape(raw_fees))
          if not isinstance(fees, dict):
              raise ValueError("ROBASE page data-fees is not a JSON object")
          start_day = date.fromisoformat(api_data["from"])
          end_day = date.fromisoformat(api_data["to"])
          day_count = (end_day - start_day).days + 1
          if day_count < 1 or day_count > 366:
              raise ValueError("ROBASE chart date range is outside the 366-day safety bound")
          codes = sorted(api_data["markets"])
          market_days = {code: {row["day"]: row for row in api_data["markets"][code]} for code in codes}
          daily_rows = []
          day = start_day
          while day <= end_day:
              key = day.isoformat()
              total_sold = 0
              total_amount = 0.0
              total_priced_sold = 0
              row = {"date": key}
              for code in codes:
                  point = market_days[code].get(key, {})
                  sold = point.get("sold", 0) or 0
                  price = point.get("price")
                  fee = fees.get(code, 0)
                  if not isinstance(fee, (int, float)) or not 0 <= fee < 1:
                      raise ValueError("Invalid marketplace fee for " + code)
                  net_price = price * (1 - fee) if isinstance(price, (int, float)) else None
                  row[code + "_sold"] = sold
                  row[code + "_price_after_fee"] = round(net_price, 8) if net_price is not None else ""
                  total_sold += sold
                  if net_price is not None and sold:
                      total_amount += net_price * sold
                      total_priced_sold += sold
              row["all_marketplaces_sold"] = total_sold
              row["all_marketplaces_price_after_fee"] = round(total_amount / total_priced_sold, 8) if total_priced_sold else ""
              daily_rows.append(row)
              day += timedelta(days=1)
          report["item_api_url"] = api_url
          report["marketplace_fees"] = fees
          report["daily_series"] = {
              "days": len(daily_rows),
              "days_with_sales": sum(1 for row in daily_rows if row["all_marketplaces_sold"]),
              "days_with_price": sum(1 for row in daily_rows if row["all_marketplaces_price_after_fee"] != ""),
              "definition": "ROBASE chart total: sales-weighted daily average of marketplace daily prices after each marketplace fee.",
          }
          report["item_api_summary"] = {
              "root_type": type(api_data).__name__,
              "root_keys": sorted(api_data.keys()) if isinstance(api_data, dict) else [],
              "from": api_data.get("from") if isinstance(api_data, dict) else None,
              "to": api_data.get("to") if isinstance(api_data, dict) else None,
              "market_codes": sorted(api_data.get("markets", {}).keys()) if isinstance(api_data, dict) and isinstance(api_data.get("markets"), dict) else [],
              "market_point_counts": {
                  code: len(rows) if isinstance(rows, list) else None
                  for code, rows in api_data.get("markets", {}).items()
              } if isinstance(api_data, dict) and isinstance(api_data.get("markets"), dict) else {},
              "item": api_data.get("item") if isinstance(api_data, dict) else None,
          }
          os.makedirs("robase-chart-diagnostics", exist_ok=True)
          with open("robase-chart-diagnostics/report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          with open("robase-chart-diagnostics/item_api.json", "w", encoding="utf-8") as f:
              json.dump(api_data, f, ensure_ascii=False, indent=2)
          csv_fields = ["date"] + [field for code in codes for field in (code + "_sold", code + "_price_after_fee")] + ["all_marketplaces_sold", "all_marketplaces_price_after_fee"]
          with open("robase-chart-diagnostics/daily_series.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=csv_fields)
              writer.writeheader()
              writer.writerows(daily_rows)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: robase-chart-diagnostics
          path: robase-chart-diagnostics/
          retention-days: 7
